name: PR checks

on:
  pull_request:

# A new commit on the same PR supersedes any checks still running for an older
# version of the branch.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python-syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      # For pull_request events, checkout tests GitHub's synthetic merge commit.
      # Requiring this check therefore verifies the PR against the current base.
      - name: Check out the PR merge commit
        uses: actions/checkout@v4

      - name: Compile Python sources
        run: python3 -m compileall -q .
